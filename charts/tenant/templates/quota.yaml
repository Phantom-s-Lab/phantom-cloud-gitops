{{- $tier := include "tenant.tier" . | fromYaml }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota
  namespace: {{ include "tenant.namespace" . }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  hard:
    {{- toYaml $tier.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limits
  namespace: {{ include "tenant.namespace" . }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      {{- toYaml $tier.limitRange | nindent 6 }}
