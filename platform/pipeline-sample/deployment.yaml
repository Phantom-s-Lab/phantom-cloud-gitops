apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-sample
  labels:
    app.kubernetes.io/name: pipeline-sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pipeline-sample
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline-sample
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sshd
          image: ghcr.io/phantom-s-lab/tenant-base:sha-e928162
          ports:
            - name: ssh
              containerPort: 2222
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "SYS_CHROOT", "AUDIT_WRITE", "KILL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            tcpSocket:
              port: ssh
