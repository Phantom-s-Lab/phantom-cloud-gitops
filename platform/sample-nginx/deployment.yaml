apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-nginx
  labels:
    app.kubernetes.io/name: sample-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-nginx
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet:
              path: /
              port: http
