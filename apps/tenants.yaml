apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenants
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/Phantom-s-Lab/phantom-cloud-gitops.git
        revision: main
        files:
          - path: tenants/*/values.yaml
  template:
    metadata:
      name: "tenant-{{ .path.basename }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/Phantom-s-Lab/phantom-cloud-gitops.git
        targetRevision: main
        path: charts/tenant
        helm:
          releaseName: "tenant-{{ .path.basename }}"
          valueFiles:
            - "../../{{ .path.path }}/values.yaml"
      destination:
        server: https://kubernetes.default.svc
        namespace: "tenant-{{ .path.basename }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
